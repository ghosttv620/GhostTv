<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>শর্ট ভিডিও স্কুল</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px; /* ডেস্কটপের জন্য প্লেয়ার উপরে */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        #player-container {
            width: 720px;
            height: 1080px;
            max-width: 720px;
            max-height: 1080px;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            flex-shrink: 0;
        }
        #video-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform-origin: center center;
            will-change: transform;
            touch-action: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
            &::-webkit-media-controls { display: none !important; }
            &::-webkit-media-controls-enclosure { display: none !important; }
            &::-webkit-media-controls-panel { display: none !important; }
            &::-webkit-media-controls-play-button { display: none !important; }
            &::-webkit-media-controls-start-playback-button { display: none !important; }
            &::-webkit-media-controls-timeline { display: none !important; }
            &::-webkit-media-controls-current-time-display { display: none !important; }
            &::-webkit-media-controls-time-remaining-display { display: none !important; }
            &::-webkit-media-controls-mute-button { display: none !important; }
            &::-webkit-media-controls-volume-slider { display: none !important; }
            &::-webkit-media-controls-fullscreen-button { display: none !important; }
            &::-moz-media-controls { display: none !important; }
            &::-moz-media-controls-panel { display: none !important; }
            controlslist: "nodownload nofullscreen noremoteplayback";
            disablepictureinpicture: true;
        }
        /* কাস্টম প্লে/পজ বাটন */
        .custom-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s ease, transform 0.2s ease;
            opacity: 0;
            pointer-events: none;
            color: #fff;
            font-size: 28px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .custom-play-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-play-btn:active {
            transform: translate(-50%, -50%) scale(0.90);
        }
        
        /* ===== পরবর্তী বাটন – গোল চিহ্নিত জায়গায় ফিক্সড ===== */
        .next-btn {
            position: fixed; /* স্ক্রিনের সাপেক্ষে ফিক্সড করে দেওয়া হয়েছে */
            bottom: 25px;    /* নিচে 25px দূরত্বে (লাল গোল চিহ্নিত স্থানে) */
            left: 50%;
            transform: translateX(-50%);
            margin: 0;       /* ডেস্কটপের মার্জিন রিমুভ করা হয়েছে */
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease, transform 0.15s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
            z-index: 30; /* ভিডিওর উপরে থাকবে */
        }
        .next-btn:active {
            transform: translateX(-50%) scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }
        .next-btn .arrow {
            font-size: 22px;
            line-height: 1;
        }
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            z-index: 20;
            pointer-events: none;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .error-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            text-align: center;
            z-index: 25;
            padding: 20px;
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            display: none;
            max-width: 80%;
        }
        
        /* ===== মোবাইলের জন্য ফিক্স (বাটন নিচে গোল চিহ্নিত জায়গায়) ===== */
        @media (max-width: 720px) {
            body {
                padding-top: 0; /* উপরের কালো অংশ দূর */
                justify-content: flex-start;
            }
            #player-container {
                position: relative;
                width: 100vw;
                height: auto;
                aspect-ratio: 9 / 16; /* ভিডিও রেশিও ধরে রাখবে */
                max-height: 80dvh; /* নিচে বাটনের জন্য জায়গা রাখা */
                max-width: 100vw;
                max-height: none;
                flex-shrink: 0;
                top: 0;
            }
            /* মোবাইলে বাটনটির স্টাইল (পজিশনিং একই থাকবে, তবে মোবাইলের মিডিয়া কোয়েরি থাকলেও ওপরের fixed স্টাইলই কাজ করবে) */
            .next-btn {
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                padding: 14px 32px;
                font-size: 16px;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.25);
                box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            }
        }
        
        /* ===== ল্যান্ডস্কেপ মোবাইলের জন্য একই নিয়ম ===== */
        @media (orientation: landscape) and (max-height: 1080px) {
            body {
                padding-top: 0;
                justify-content: flex-start;
            }
            #player-container {
                position: relative;
                width: 100vw;
                height: auto;
                aspect-ratio: 9 / 16;
                max-height: 80dvh;
                max-width: 100vw;
                max-height: none;
                flex-shrink: 0;
                top: 0;
            }
            .next-btn {
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                padding: 14px 32px;
                font-size: 16px;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.25);
                box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>
    <div id="player-container">
        <div id="video-wrapper">
            <video id="myVideo" playsinline></video>
        </div>
        <div class="custom-play-btn" id="customPlayBtn">▶</div>
    </div>
    <div class="next-btn" id="nextBtn">
        <span>পরবর্তী</span>
        <span class="arrow">→</span>
    </div>

    <script>
        (function() {
            // ===== কনফিগারেশন =====
            const OWNER = "ghosttv620";
            const REPO = "All-Video";
            const TAG = "Short";
            const TOKEN = "";

            // ===== DOM =====
            const container = document.getElementById('player-container');
            const video = document.getElementById('myVideo');
            const wrapper = document.getElementById('video-wrapper');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const customBtn = document.getElementById('customPlayBtn');
            const nextBtn = document.getElementById('nextBtn');

            let videoUrls = [];
            let currentIndex = 0;
            let isPlaying = true;
            let btnTimeout = null;

            // ===== লকড ভিডিও ট্র্যাক =====
            let lockedIndices = new Set();

            // ===== পিন্চ জুম ও প্যান ভেরিয়েবল =====
            let currentScale = 1;
            let currentTranslateX = 0;
            let currentTranslateY = 0;
            const MIN_SCALE = 1;
            const MAX_SCALE = 3;
            let initialPinchDistance = 0;
            let initialScale = 1;
            let initialTranslateX = 0;
            let initialTranslateY = 0;
            let isPinching = false;
            let lastTapTime = 0;
            let pinchCenterX = 0;
            let pinchCenterY = 0;

            let isPanning = false;
            let startPanX = 0;
            let startPanY = 0;
            let startTranslateX = 0;
            let startTranslateY = 0;

            // ===== Right ক্লিক বন্ধ =====
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // ===== কাস্টম বাটন ফাংশন =====
            function updateButtonIcon() {
                customBtn.textContent = video.paused ? '▶' : '⏸';
            }

            function showPlayButton(show) {
                if (show) {
                    updateButtonIcon();
                    customBtn.classList.add('show');
                    clearTimeout(btnTimeout);
                    btnTimeout = setTimeout(() => {
                        customBtn.classList.remove('show');
                    }, 1800);
                } else {
                    customBtn.classList.remove('show');
                    clearTimeout(btnTimeout);
                }
            }

            function togglePlayPause() {
                if (video.paused) {
                    video.play().catch(() => {});
                    isPlaying = true;
                } else {
                    video.pause();
                    isPlaying = false;
                }
                showPlayButton(true);
            }

            // ===== জুম + ট্রান্সলেট ফাংশন =====
            function clampTranslation(scale, tx, ty) {
                const rect = container.getBoundingClientRect();
                const maxX = (rect.width * (scale - 1)) / 2;
                const maxY = (rect.height * (scale - 1)) / 2;
                return {
                    x: Math.min(Math.max(tx, -maxX), maxX),
                    y: Math.min(Math.max(ty, -maxY), maxY)
                };
            }

            function setTransform(scale, tx, ty) {
                const clamped = clampTranslation(scale, tx, ty);
                currentScale = Math.min(Math.max(scale, MIN_SCALE), MAX_SCALE);
                currentTranslateX = clamped.x;
                currentTranslateY = clamped.y;
                wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(${currentScale})`;
            }

            function resetZoom() {
                setTransform(1, 0, 0);
            }

            // ===== ডাবল ট্যাপ =====
            function handleDoubleTap(e) {
                const now = Date.now();
                const timeSinceLastTap = now - lastTapTime;
                if (timeSinceLastTap < 300) {
                    resetZoom();
                    lastTapTime = 0;
                    return true;
                }
                lastTapTime = now;
                return false;
            }

            // ===== পিন্চ জুম ইভেন্ট =====
            function getPinchDistance(touches) {
                if (touches.length < 2) return 0;
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function getPinchCenter(touches) {
                if (touches.length < 2) return { x: 0, y: 0 };
                const rect = container.getBoundingClientRect();
                const cx = (touches[0].clientX + touches[1].clientX) / 2 - rect.left;
                const cy = (touches[0].clientY + touches[1].clientY) / 2 - rect.top;
                return { x: cx, y: cy };
            }

            container.addEventListener('touchstart', function(e) {
                const touches = e.touches;
                if (touches.length === 2) {
                    isPinching = true;
                    isPanning = false;
                    initialPinchDistance = getPinchDistance(touches);
                    initialScale = currentScale;
                    initialTranslateX = currentTranslateX;
                    initialTranslateY = currentTranslateY;
                    const center = getPinchCenter(touches);
                    pinchCenterX = center.x;
                    pinchCenterY = center.y;
                    e.preventDefault();
                } else if (touches.length === 1 && currentScale > 1) {
                    isPanning = true;
                    isPinching = false;
                    startPanX = touches[0].clientX;
                    startPanY = touches[0].clientY;
                    startTranslateX = currentTranslateX;
                    startTranslateY = currentTranslateY;
                    e.preventDefault();
                }
            }, { passive: false });

            container.addEventListener('touchmove', function(e) {
                const touches = e.touches;
                if (touches.length === 2 && isPinching) {
                    const distance = getPinchDistance(touches);
                    if (initialPinchDistance > 0) {
                        const scaleFactor = distance / initialPinchDistance;
                        let newScale = initialScale * scaleFactor;
                        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
                        const rect = container.getBoundingClientRect();
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const dx = pinchCenterX - centerX;
                        const dy = pinchCenterY - centerY;
                        let newTx = initialTranslateX + dx * (1 - newScale / initialScale);
                        let newTy = initialTranslateY + dy * (1 - newScale / initialScale);
                        setTransform(newScale, newTx, newTy);
                        e.preventDefault();
                    }
                } else if (touches.length === 1 && isPanning) {
                    const dx = touches[0].clientX - startPanX;
                    const dy = touches[0].clientY - startPanY;
                    let newTx = startTranslateX + dx;
                    let newTy = startTranslateY + dy;
                    setTransform(currentScale, newTx, newTy);
                    e.preventDefault();
                }
            }, { passive: false });

            container.addEventListener('touchend', function(e) {
                if (e.changedTouches.length === 1 && !isPinching && !isPanning) {
                    const touch = e.changedTouches[0];
                    if (handleDoubleTap(touch)) {
                        e.preventDefault();
                        return;
                    }
                }
                if (isPinching) {
                    isPinching = false;
                    initialPinchDistance = 0;
                    e.preventDefault();
                }
                if (isPanning) {
                    isPanning = false;
                    e.preventDefault();
                }
            }, { passive: false });

            // ===== চেঞ্জ বাটন =====
            nextBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                loadRandomVideo();
            });

            nextBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                loadRandomVideo();
            });

            // ===== ভিডিও লোড =====
            async function fetchVideoUrls() {
                try {
                    loader.style.display = 'block';
                    errorMsg.style.display = 'none';

                    const headers = { Accept: "application/vnd.github+json" };
                    if (TOKEN && TOKEN.trim() !== "") {
                        headers["Authorization"] = `token ${TOKEN}`;
                    }

                    const res = await fetch(
                        `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}`,
                        { headers }
                    );

                    if (!res.ok) {
                        if (res.status === 404) throw new Error('রিলিজ পাওয়া যায়নি!');
                        throw new Error(`HTTP ${res.status}`);
                    }

                    const data = await res.json();
                    if (!data.assets || data.assets.length === 0) {
                        throw new Error('কোনো ভিডিও পাওয়া যায়নি!');
                    }

                    videoUrls = data.assets
                        .filter(asset => /\.(mp4|webm|ogg|mov|m4v)$/i.test(asset.name))
                        .map(asset => asset.browser_download_url);

                    if (videoUrls.length === 0) {
                        throw new Error('কোনো ভিডিও ফাইল পাওয়া যায়নি!');
                    }

                    loader.style.display = 'none';
                    lockedIndices = new Set();
                    currentIndex = Math.floor(Math.random() * videoUrls.length);
                    lockedIndices.add(currentIndex);
                    
                    console.log(`📹 মোট ভিডিও: ${videoUrls.length}, লকড: ${lockedIndices.size}`);
                    playVideo(currentIndex);

                } catch (error) {
                    loader.style.display = 'none';
                    errorMsg.textContent = `❌ ${error.message}`;
                    errorMsg.style.display = 'block';
                    console.error(error);
                }
            }

            // ===== প্লে ভিডিও =====
            function playVideo(index) {
                if (videoUrls.length === 0) return;
                const url = videoUrls[index];
                currentIndex = index;
                
                resetZoom();
                
                video.src = url;
                video.load();
                
                video.volume = 1;
                video.muted = false;
                
                isPlaying = true;

                video.oncanplay = function() {
                    video.play().catch(() => {});
                    customBtn.classList.remove('show');
                };

                video.onerror = function() {
                    console.warn('ভিডিও লোডে সমস্যা, পরবর্তী ভিডিও লোড হচ্ছে...');
                    setTimeout(() => {
                        loadRandomVideo();
                    }, 1500);
                };

                video.onended = function() {
                    loadRandomVideo();
                };

                video.onplay = function() {
                    isPlaying = true;
                    updateButtonIcon();
                    customBtn.classList.remove('show');
                    clearTimeout(btnTimeout);
                };

                video.onpause = function() {
                    isPlaying = false;
                    updateButtonIcon();
                    showPlayButton(true);
                };
            }

            // ===== রেনডম ভিডিও (শুধু আনলকড) + রিসেট =====
            function loadRandomVideo() {
                if (videoUrls.length === 0) return;

                if (lockedIndices.size >= videoUrls.length) {
                    lockedIndices = new Set();
                    console.log('🔄 সব ভিডিও দেখা শেষ, নতুন চক্র শুরু হচ্ছে...');
                }

                let availableIndices = [];
                for (let i = 0; i < videoUrls.length; i++) {
                    if (!lockedIndices.has(i)) {
                        availableIndices.push(i);
                    }
                }

                if (availableIndices.length === 0) {
                    lockedIndices = new Set();
                    availableIndices = [];
                    for (let i = 0; i < videoUrls.length; i++) {
                        availableIndices.push(i);
                    }
                }

                const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                lockedIndices.add(randomIndex);
                currentIndex = randomIndex;
                
                console.log(`📹 লকড: ${lockedIndices.size}/${videoUrls.length}, বেছে নেওয়া হয়েছে: ${randomIndex}`);
                playVideo(randomIndex);
            }

            // ===== স্ক্রল/সোয়াইপ/কী-প্রেস ডিজেবল =====
            document.addEventListener('wheel', function(e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                }
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    togglePlayPause();
                }
            });

            // ===== কাস্টম বাটন =====
            customBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePlayPause();
            });

            customBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                togglePlayPause();
            });

            container.addEventListener('click', function(e) {
                togglePlayPause();
            });

            // ===== শুরু =====
            fetchVideoUrls();

            console.log('🎬 শর্ট ভিডিও স্কুল রেডি!');
            console.log('📌 স্ক্রল/সোয়াইপ/↑↓ কী দিয়ে ভিডিও চেঞ্জ হয় না');
            console.log('👉 নিচের "পরবর্তী →" বাটনে চাপ দিন ভিডিও চেঞ্জ করতে');
            console.log('👆 ভিডিও ট্যাপ করলে পজ/প্লে');
            console.log('🔒 যেটা দেখছেন সেটা লক হয়ে থাকবে, আর আসবে না');
            console.log('🔄 সব শেষ হলে আপনা-আপনি রিসেট হয়ে নতুন চক্র শুরু হবে');
