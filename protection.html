<!DOCTYPE html>
<script>
  (function() {
    // শুধুমাত্র অনুমোদিত ডোমেইন
    const allowedDomains = ['ghosttv.top', 'www.ghosttv.top'];
    const currentHost = window.location.hostname;

    // চেক করা
    if (!allowedDomains.includes(currentHost)) {
      // রিডাইরেক্ট করা
      window.location.replace('https://ghosttv.top' + window.location.pathname);
    }
  })();
</script>
