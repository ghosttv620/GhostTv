<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gh👻st_File Downloads</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* ওয়েবসাইট থেকে টেক্সট সিলেক্ট বা কপি করা বন্ধ করার জন্য */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, #070913 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 15px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header / Logo - One Line Fix for Mobile */
        .header {
            text-align: center;
            margin-bottom: 35px;
            padding: 5px;
            width: 100%;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            display: inline-block;
            white-space: nowrap;
            letter-spacing: 0.5px;
            animation: glowText 2s ease-in-out infinite alternate;
        }

        @media (min-width: 768px) {
            .logo {
                font-size: 34px;
            }
        }

        .logo .ghost-part {
            color: #ff3333;
        }

        .logo .downloader-part {
            color: #00bfff;
            margin-left: 6px;
        }

        @keyframes glowText {
            0% {
                text-shadow: 0 0 10px rgba(255, 51, 51, 0.4), 0 0 20px rgba(0, 191, 255, 0.4);
            }
            100% {
                text-shadow: 0 0 25px rgba(255, 51, 51, 0.9), 0 0 40px rgba(0, 191, 255, 0.9);
            }
        }

        /* Cards Layout */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Premium Glassmorphism Download Card */
        .download-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .download-card:hover {
            border-color: rgba(0, 191, 255, 0.6);
            transform: translateY(-7px);
            box-shadow: 0 15px 35px rgba(0, 191, 255, 0.25), inset 0 0 15px rgba(0, 191, 255, 0.1);
        }

        .download-card.selected {
            border: 1px solid rgba(0, 255, 0, 0.8);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.15);
            transform: translateY(-7px);
        }

        /* কার্ডের ভেতরের নাম কালারফুল অ্যানিমেশন */
        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            animation: titleColorAnim 4s infinite;
        }

        @keyframes titleColorAnim {
            0% { color: #ff3333; }
            33% { color: #00bfff; }
            66% { color: #00ff00; }
            100% { color: #ff3333; }
        }

        /* Card Image Box with Premium Styling */
        .card-img-box {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .card-img-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.5);
            z-index: 1;
        }

        .card-img-box img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
            pointer-events: none;
        }

        .download-card:hover .card-img-box img, .download-card.selected .card-img-box img {
            transform: scale(1.08);
        }

        /* Premium Download Button with Animation */
        .card-download-btn {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: white;
            padding: 13px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(255, 51, 51, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-download-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.6s;
        }

        .card-download-btn:hover::after {
            left: 100%;
        }

        .download-card.selected .card-download-btn {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
            transform: scale(1.02);
            animation: btnPulse 1.5s infinite;
        }

        @keyframes btnPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .card-download-btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #9ca3af;
            font-size: 15px;
            padding: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 35px 0 10px 0;
            margin-top: 40px;
            color: #6b7280;
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header with One-line Animated Name -->
        <div class="header">
            <div class="logo">
                <span class="ghost-part">Gh👻st_File</span>
                <span class="downloader-part">Downloads</span>
            </div>
        </div>

        <!-- Cards Container -->
        <div class="cards-container" id="cardsContainer">
            <div class="status-msg">Loading files...</div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Copyright 2026 Gh👻st_File Downloads. All Rights Reserved.</p>
        </footer>

    </div>

    <script>
        // ১. রাইট ক্লিক ডিজেবল করা
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // ২. কিবোর্ড শর্টকাট দিয়ে ডেভলপার টুল ও সোর্স কোড দেখা বন্ধ করা
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || 
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        function selectCard(card) {
            const allCards = document.querySelectorAll('.download-card');
            allCards.forEach(c => {
                if (c !== card) {
                    c.classList.remove('selected');
                }
            });
            card.classList.toggle('selected');
        }

        async function loadFiles() {
            const container = document.getElementById('cardsContainer');
            const jsonUrl = 'https://raw.githubusercontent.com/nirob1520/Ghost-File/main/Ghost_File.json';

            const fallbackData = [
                { title: "Free Fire", image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300", downloadLink: "#" },
                { title: "Hyper V Win_10", image: "https://images.unsplash.com/photo-1629654297299-c8506221ca97?w=300", downloadLink: "#" },
                { title: "Hyper V Win_11", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300", downloadLink: "#" }
            ];

            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const files = await response.json();
                const activeFiles = files.filter(item => item.status !== false);
                renderCards(activeFiles.length > 0 ? activeFiles : fallbackData);

            } catch (error) {
                console.warn('Using fallback data due to fetch error:', error);
                renderCards(fallbackData);
            }
        }

        function renderCards(files) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            files.forEach(item => {
                const card = document.createElement('div');
                card.className = 'download-card';
                card.setAttribute('onclick', 'selectCard(this)');

                card.innerHTML = `
                    <div class="card-title">${item.title || 'Untitled'}</div>
                    <div class="card-img-box" style="--bg-img: url('${item.image || ''}')">
                        <img src="${item.image || ''}" alt="${item.title || 'File Image'}" draggable="false">
                    </div>
                    <a href="${item.downloadLink || '#'}" class="card-download-btn" target="_blank">
                        <i class="fa-solid fa-download"></i> DOWNLOAD
                    </a>
                `;

                container.appendChild(card);
            });
        }

        loadFiles();
    </script>
</body>
</html>
