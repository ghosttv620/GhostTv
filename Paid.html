<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>সাবস্ক্রিপশন প্ল্যান</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: transparent;
            padding: 4px;
        }
        .bangla {
            font-family: 'Hind Siliguri', system-ui, sans-serif;
        }
        .plan-card {
            transition: transform 0.12s ease;
        }
        .plan-card:hover {
            transform: scale(1.01);
        }
        .plan-list li {
            font-size: 11px;
        }
        .plan-list li span {
            font-size: 12px;
        }

        /* ——— ULTRA COMPACT ——— */
        @media (max-width: 480px) {
            body {
                padding: 2px;
            }
            .plan-card {
                padding: 8px 10px !important;
                border-radius: 10px !important;
            }
            .plan-card h2 {
                font-size: 15px !important;
            }
            .plan-card .price {
                font-size: 20px !important;
                line-height: 1.2 !important;
            }
            .plan-card .price span {
                font-size: 10px !important;
            }
            .plan-card .sub-title {
                font-size: 11px !important;
            }
            .plan-card .plan-list li {
                font-size: 10px !important;
                gap: 4px !important;
            }
            .plan-card .plan-list li span {
                font-size: 10px !important;
            }
            .plan-card button,
            .plan-card a {
                font-size: 12px !important;
                padding: 6px !important;
                border-radius: 6px !important;
            }
            .badge {
                font-size: 8px !important;
                padding: 0 8px !important;
                top: -6px !important;
                line-height: 16px !important;
            }
            .plan-card .bg-white\/40,
            .plan-card .bg-black\/30 {
                padding: 6px 8px !important;
                border-radius: 6px !important;
                margin-bottom: 6px !important;
            }
            .plan-card .text-center.mb-3 {
                margin-bottom: 4px !important;
            }
            .plan-card .mt-2 {
                margin-top: 2px !important;
            }
            .plan-card .mt-0\.5 {
                margin-top: 0 !important;
            }
            .plan-list .space-y-1\.5>*+* {
                margin-top: 2px !important;
            }
            .gap-4 {
                gap: 8px !important;
            }
            .mt-4 {
                margin-top: 8px !important;
            }
            .text-\[10px\] {
                font-size: 8px !important;
            }
        }

        /* base compact (always small) */
        .plan-card {
            padding: 10px 12px;
            border-radius: 12px;
        }
        .plan-card h2 {
            font-size: 17px;
        }
        .plan-card .price {
            font-size: 22px;
        }
        .plan-card .price span {
            font-size: 11px;
        }
        .plan-card .sub-title {
            font-size: 12px;
        }
        .plan-list li {
            font-size: 11px;
            gap: 4px;
        }
        .plan-list li span {
            font-size: 11px;
        }
        .plan-card a {
            font-size: 13px;
            padding: 7px;
            border-radius: 7px;
        }
        .badge {
            font-size: 9px;
            padding: 0 10px;
            top: -7px;
            line-height: 18px;
        }
        .plan-card .bg-white\/40,
        .plan-card .bg-black\/30 {
            padding: 6px 10px;
            border-radius: 7px;
            margin-bottom: 7px;
        }
        .plan-card .text-center.mb-3 {
            margin-bottom: 4px;
        }
        .plan-card .mt-2 {
            margin-top: 2px;
        }
        .plan-card .mt-0\.5 {
            margin-top: 0;
        }
        .plan-list .space-y-1\.5>*+* {
            margin-top: 2px;
        }
        .gap-4 {
            gap: 10px;
        }
        .mt-4 {
            margin-top: 8px;
        }
        .text-\[10px\] {
            font-size: 9px;
        }
    </style>
</head>
<body>

    <div class="max-w-sm w-full mx-auto">
        <div class="flex flex-col gap-3">

            <!-- ——— PRIME CARD ——— -->
            <div class="plan-card bg-gradient-to-br from-lime-400 to-yellow-300 border border-lime-500/60 shadow-sm">
                <div class="text-center mb-1">
                    <h2 class="font-bold text-zinc-900">Prime</h2>
                    <p class="bangla text-xs text-zinc-700 sub-title">প্রাইম সাবস্ক্রিপশন</p>
                    <div class="mt-1 text-xl font-bold text-zinc-900 price">৯৯৳<span class="text-[10px] font-normal text-zinc-700">/মাস</span></div>
                </div>

                <div class="bg-white/40 backdrop-blur-sm rounded-lg px-3 py-1.5 mb-1.5">
                    <ul class="space-y-0.5 plan-list">
                        <li class="flex items-center gap-1.5 text-zinc-800"><span class="text-green-700 font-bold text-xs">✓</span> মুভি</li>
                        <li class="flex items-center gap-1.5 text-zinc-800"><span class="text-green-700 font-bold text-xs">✓</span> টিভি</li>
                        <li class="flex items-center gap-1.5 text-zinc-800"><span class="text-green-700 font-bold text-xs">✓</span> VIP এক্সেস</li>
                    </ul>
                </div>

                <a href="https://wa.me/qr/L3CV4ZSUM2MPH1" target="_blank"
                class="block w-full bg-zinc-900/90 text-white rounded-lg font-semibold text-center hover:bg-zinc-800 transition shadow-sm">
                সাবস্ক্রাইব করুন
            </a>
        </div>

        <!-- ——— PREMIUM CARD ——— -->
        <div class="plan-card bg-gradient-to-br from-orange-600/90 to-red-600/90 border-2 border-orange-400/60 relative shadow-sm">
            <div class="absolute -top-2 left-1/2 -translate-x-1/2 bg-orange-500 text-white rounded-full font-medium tracking-wide badge"> জনপ্রিয় </div>

            <div class="text-center mb-1">
                <h2 class="font-bold text-white">Premium</h2>
                <p class="bangla text-xs text-orange-100 sub-title">প্রিমিয়াম সাবস্ক্রিপশন</p>
                <div class="mt-1 text-xl font-bold text-white price">১৫০৳<span class="text-[10px] font-normal text-orange-100">/মাস</span></div>
            </div>

            <div class="bg-black/30 backdrop-blur-sm rounded-lg px-3 py-1.5 mb-1.5">
                <ul class="space-y-0.5 plan-list">
                    <li class="flex items-center gap-1.5 text-white"><span class="text-green-400 text-xs">✓</span> মুভি</li>
                    <li class="flex items-center gap-1.5 text-white"><span class="text-green-400 text-xs">✓</span> টিভি</li>
                    <li class="flex items-center gap-1.5 text-white"><span class="text-green-400 text-xs">✓</span> অ্যাডাল্ট</li>
                    <li class="flex items-center gap-1.5 text-white"><span class="text-green-400 text-xs">✓</span> VIP এক্সেস</li>
                    <li class="flex items-center gap-1.5 text-white"><span class="text-green-400 text-xs">✓</span> ২৪/৭ সাপোর্ট</li>
                </ul>
            </div>

            <a href="https://wa.me/qr/L3CV4ZSUM2MPH1" target="_blank"
            class="block w-full bg-white/90 text-black rounded-lg font-semibold text-center hover:bg-white transition shadow-sm">
            সাবস্ক্রাইব করুন
        </a>
    </div>

</div>

<p class="text-center text-zinc-500 mt-2 text-[9px]">যেকোনো সময় ক্যানসেল করতে পারবেন</p>
</div>

</body>
</html>
